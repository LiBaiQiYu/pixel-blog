<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL://BLOG</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='%23070b07'/><rect x='1' y='1' width='2' height='2' fill='%2339ff6e'/><rect x='5' y='1' width='2' height='2' fill='%2339ff6e'/><rect x='2' y='5' width='4' height='1' fill='%2339ff6e'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b07;
  --panel:#0a120a;
  --fg:#39ff6e;
  --dim:#1f8a44;
  --accent:#c9ffd8;
  --glow:rgba(57,255,110,.45);
}
body[data-theme="amber"]{
  --bg:#0d0803;
  --panel:#150e05;
  --fg:#ffb642;
  --dim:#8a5a16;
  --accent:#ffe9c2;
  --glow:rgba(255,182,66,.45);
}
body[data-theme="ice"]{
  --bg:#04070d;
  --panel:#08101a;
  --fg:#53c7ff;
  --dim:#1c5f86;
  --accent:#d6f2ff;
  --glow:rgba(83,199,255,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:'VT323','DotGothic16',monospace;
  font-size:21px;
  line-height:1.35;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
#stage{
  width:min(900px,96vw);
  height:min(720px,94vh);
  position:relative;
  animation:poweron .45s steps(6) both;
}
@keyframes poweron{
  0%{transform:scale(.02,.01);filter:brightness(6)}
  60%{transform:scale(1.03,1.02)}
  100%{transform:scale(1);filter:brightness(1)}
}
#screen{
  position:absolute;inset:0;
  background:var(--panel);
  border:3px solid var(--fg);
  box-shadow:0 0 0 3px var(--bg),0 0 24px var(--glow),inset 0 0 60px rgba(0,0,0,.55);
  display:flex;flex-direction:column;
  overflow:hidden;
  animation:flicker 4s infinite steps(30);
}
@keyframes flicker{
  0%,100%{opacity:1}92%{opacity:1}93%{opacity:.86}94%{opacity:1}97%{opacity:.93}98%{opacity:1}
}
#titlebar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  border-bottom:2px solid var(--dim);
  padding:6px 12px;
  font-size:14px;
  letter-spacing:1px;
  color:var(--accent);
}
#titlebar .dots{margin-left:auto;display:flex;gap:6px}
#titlebar .dot{width:10px;height:10px;background:var(--dim)}
#titlebar .dot.on{background:var(--fg);box-shadow:0 0 6px var(--glow)}
#view{
  flex:1 1 auto;
  overflow-y:auto;
  padding:14px 18px 6px;
  scrollbar-width:thin;
  scrollbar-color:var(--dim) transparent;
}
#view::-webkit-scrollbar{width:8px}
#view::-webkit-scrollbar-thumb{background:var(--dim)}
#output .line{white-space:pre-wrap;word-break:break-word;min-height:1em}
.dim{color:var(--dim)}
.accent{color:var(--accent)}
.file{
  color:var(--accent);cursor:pointer;text-decoration:underline dotted;
  text-underline-offset:4px;
}
.file:hover{background:var(--fg);color:var(--bg);text-decoration:none}
.cmd-name{color:var(--accent)}
.err{color:#ff5f5f;text-shadow:0 0 6px rgba(255,95,95,.4)}
.banner{
  color:var(--fg);
  text-shadow:0 0 8px var(--glow);
  font-size:15px;line-height:1.15;
}
#inputrow{
  flex:0 0 auto;
  display:flex;align-items:baseline;gap:8px;
  padding:8px 18px 14px;
  position:relative;
  visibility:hidden;
}
#prompt{flex:0 0 auto;white-space:nowrap}
#prompt .user{color:var(--accent)}
#mirror{
  white-space:pre-wrap;word-break:break-all;
  min-width:1ch;
}
#cursor{
  display:inline-block;width:.6em;height:1.1em;
  background:var(--fg);
  vertical-align:text-bottom;
  box-shadow:0 0 8px var(--glow);
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}
#hidden-input{
  position:absolute;left:4px;top:4px;
  width:1px;height:1px;
  opacity:0;border:0;padding:0;margin:0;
  background:transparent;color:transparent;
  pointer-events:none;
}
#scanlines{
  position:absolute;inset:0;pointer-events:none;z-index:5;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38) 100%);
}
h1.logo{
  font-family:'Press Start 2P','VT323',monospace;
  font-size:13px;color:var(--accent);
  text-shadow:0 0 8px var(--glow);
  letter-spacing:1px;
}
table.help td{padding:0 14px 2px 0}
table.help td:first-child{color:var(--accent);white-space:nowrap}
.post-head{
  border-bottom:1px dashed var(--dim);
  margin-bottom:8px;padding-bottom:6px;color:var(--dim)
}
.post-body{white-space:pre-wrap}
</style>
</head>
<body data-theme="green">
<div id="stage">
  <div id="screen">
    <div id="titlebar">
      <span>■ ■ ■</span>
      <h1 class="logo">PIXEL://BLOG_v1.0</h1>
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot on"></div></div>
    </div>
    <div id="view"><div id="output"></div></div>
    <div id="inputrow">
      <span id="prompt"><span class="user">guest</span>@pixel:<span>~</span>$</span>
      <span id="mirror"></span><span id="cursor"></span>
      <input id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div id="scanlines"></div>
  </div>
</div>
<script>
"use strict";
const POSTS={
"001_hello_world.md":{date:"2026-06-01",tags:"meta",body:
`你好，世界。

这是博客的第一篇文章。
没有 CMS，没有评论，没有追踪脚本——
只有一个终端、一块发光的屏幕，
和你正在敲下的每一个字符。

为什么要做像素风的博客？
因为 8-bit 的年代，每一帧都要精打细算，
每一行代码都看得见边界。

约束，是最高级的自由。

> stay low-fi, stay curious.`},
"002_pixel_art.md":{date:"2026-07-14",tags:"design",body:
`像素美学：约束即自由。

16 色调色板，320x200 的分辨率。
老游戏的美不在于粗糙，
而在于创作者必须在限制内做出选择。

设计启示：
  1. 先定死限制，再谈创意
  2. 删掉一切不承载信息的装饰
  3. 让每个像素都有存在的理由

少即是多，但「少」比「多」难得多。`},
"003_terminal_life.md":{date:"2026-08-09",tags:"workflow",body:
`我的极简工作流。

工具栈：
  编辑器   vim（十年没换过）
  终端     一切操作的入口
  笔记     纯文本 + git
  日程     一个 txt 文件

原则：
  文件大于应用，文本大于格式，
  键盘大于鼠标，可备份大于一切。

当所有东西都是 .txt，
你就永远不会再丢数据。`},
"004_retro_future.md":{date:"2026-08-25",tags:"essay",body:
`复古未来主义。

我们怀念的从来不是旧技术本身，
而是那个「技术还很诚实」的年代：
机器做什么，屏幕上就显示什么。

没有算法投喂，没有无限滚动，
关机就是真的关机。

也许最好的未来，
是把控制权还给你的那种过去。`},
"005_wandering.md":{date:"2026-08-25",tags:"prose",body:
`流浪计划

Chapter1
年幼的时候跌倒是常态,倒下了就顺势趴在地上大哭,也许是为了让周围人察觉,以至于他们向自己伸出援手.
后来长大成人,没什么机会跌倒,渐而没了求援心.
某天路滑真的摔了一跤,也只好咬着牙爬起来.倘若是哭起来,在过往的行人眼里估计就成了异类.
然而,孩子摔跤多半是不大疼的.
时光带来了忍让和孤立,倾诉和哭泣的机会却越来越少.
从能与谁说到能说什么,考虑圆满以后,话终于还是吞在了心里.
因为即便说出口,那人也未必不会幸灾乐祸的非议或者窃笑.
随后就更孤立,对外一致微笑或者沉默.
那之后的座无虚席和空无一人没什么区别,无非一个吵闹,一个安静.

Chapter2
那些年全班合唱的最初的梦想,如今只好自弹自唱.
一个人去远方的时候,车厢里响起这首歌,深觉自己已经和许多最初的美好道了别.
联系人少了又多,新陈代谢一般.错过或者遗忘都不是好受的事,可却无法阻拦.
太多的故事开头是微笑和问候,结局是沉默和抱歉.
我们享受着周而复始的过程,觉得自己在变得成熟老练,却早已经丢下了初心.
岁月是会复仇的,否则哪会有那么多人在深夜无法入眠,否则谁会离开故地选择去流浪他方.

Chapter3
冬天的麻雀成了视线中最热闹的生命.
周遭的雾霾和霜降好不荒芜.

Chapter4
我刚坐上离家列车几个钟头,家的那边就大雪纷飞.
很多期待如此.
期待不来,降临已迟.
列车驶入夜的半球,晴空万里,无关雨雪.
在窗边数会星星吧.

Chapter5
有很多看起来绝佳的路线,却总在人潮汹涌中随遇而安.

Chapter6
列车抵达终点站,大家从昏沉中清醒了几分.
同行的伙伴不知什么时候匆忙的下了车,窜入人群,没有再等待.
听着身边人聊的热闹,插不上嘴,也找不到可以说话的人.
那就赶紧走吧,去下一个地方.

Chapter7
对于流浪的人而言,哪里称得上是家乡呢?
那渐渐模糊的故乡,漂泊辗转的旅途,无法预知的未来,大概是要四处为家才能坚持住流浪下去吧.
免不了的归途终于变得陌生,不再对某处地点设立确凿的归属感.对人情变换适应的很快,甚至恨不得摆脱世俗.
城市里霓虹闪耀,某家餐馆老板的热情款待和清凉的空气就足够让我觉得温馨.
和陌生人交谈也很不错,彼此的不了解更容易肆无忌惮,无所顾虑,交换思想,相互取益,后会无期.
这个世界总会是美好更多一些.
流浪的人更容易满足.

Chapter8
听了一首《无法离地的飞行》。
分享给她，她说没有戳中她的心。
人们总是从单薄的歌词中听到埋藏着深厚故事的自己。
我开心，她没有听到自己。
如果可以的话，我也想看到《四海》二字不心生涟漪。
就那样简单快乐的活着。`}
};
const $=s=>document.querySelector(s);
const view=$("#view"),out=$("#output"),row=$("#inputrow"),
      mirror=$("#mirror"),cursor=$("#cursor"),input=$("#hidden-input");
let hist=[],hi=-1,busy=true;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const scrollEnd=()=>{view.scrollTop=view.scrollHeight};
function print(html="",cls=""){
  const d=document.createElement("div");
  d.className="line "+cls;d.innerHTML=html||"&nbsp;";
  out.appendChild(d);scrollEnd();
}
function raw(t){print(esc(t))}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function type(t,delay){
  const d=document.createElement("div");d.className="line";
  out.appendChild(d);
  for(let i=0;i<=t.length;i++){d.textContent=t.slice(0,i);scrollEnd();await sleep(delay);}
}
const PROMPT='<span class="user">guest</span>@pixel:<span>~</span>$';
function echo(cmd){print('<span class="dim">'+PROMPT+'</span> '+esc(cmd));}
function renderInput(){mirror.textContent=input.value;}
async function boot(){
  await sleep(500);
  await type("PIXEL BIOS v2.04 ... OK",24);await sleep(120);
  await type("MEM CHECK 640K ...... OK",24);await sleep(120);
  await type("LOADING FONT ROM .... OK",24);await sleep(200);
  print("");
  const art=
" ___ _ _ _ _____ ___   ___\n"+
"|_ _| | | |_   _| _ \\ /_\\ \n"+
" | || |_| | | | |   // _ \\\n"+
"|___|\\___/  |_| |_|_\\/_/ \\_\\";
  print('<span class="banner">'+esc(art)+"</span>");
  print("");
  print('欢迎来到 <span class="accent">像素终端博客</span> —— 输入 <span class="cmd-name">help</span> 查看可用命令');
  print('<span class="dim">提示: 输入 ls 浏览文章, 点击文件名可直接阅读, Tab 可补全</span>');
  print("");
  busy=false;row.style.visibility="visible";focusInput();
}
function focusInput(){if(!busy)input.focus({preventScroll:true});}
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".file"))focusInput();});
window.addEventListener("focus",focusInput);
function submit(){
  const v=input.value.trim();input.value="";renderInput();
  if(v)hist.push(v);
  hi=hist.length;
  exec(v);
}
function histMove(d){
  hi=Math.max(0,Math.min(hi+d,hist.length));
  input.value=hist[hi]||"";renderInput();
}
document.addEventListener("keydown",e=>{
  if(busy||e.isComposing)return;
  if(document.activeElement===input)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Enter"){e.preventDefault();submit();}
  else if(e.key.length===1){e.preventDefault();input.value+=e.key;renderInput();focusInput();}
  else if(e.key==="Backspace"){e.preventDefault();input.value=input.value.slice(0,-1);renderInput();focusInput();}
  else if(e.key==="ArrowUp"){e.preventDefault();histMove(-1);focusInput();}
  else if(e.key==="ArrowDown"){e.preventDefault();histMove(1);focusInput();}
  else if(e.key==="Tab")focusInput();
  else focusInput();
});
input.addEventListener("input",renderInput);
input.addEventListener("keydown",e=>{
  if(busy||e.isComposing)return;
  if(e.key==="Enter"){submit();}
  else if(e.key==="ArrowUp"){e.preventDefault();histMove(-1);}
  else if(e.key==="ArrowDown"){e.preventDefault();histMove(1);}
  else if(e.key==="Tab"){e.preventDefault();
    const parts=input.value.split(/\s+/);const last=parts[parts.length-1];
    if(parts[0]==="cat"&&last){
      const m=Object.keys(POSTS).find(f=>f.startsWith(last));
      if(m){parts[parts.length-1]=m;input.value=parts.join(" ");renderInput();}
    }
  }
});
function fmtDate(n){return POSTS[n].date;}
function cmdLs(){
  print("<span class=\"dim\">INDEX  FILE                   DATE        TAGS</span>");
  Object.keys(POSTS).forEach((f,i)=>{
    const p=POSTS[f];
    print(
      String(i+1).padStart(3)+"    "+
      '<span class="file" data-cmd="cat '+f+'">'+esc(f)+"</span>"+
      "&nbsp;".repeat(Math.max(1,21-f.length))+
      '<span class="dim">'+p.date+"  "+p.tags+"</span>"
    );
  });
  print("");
  print('<span class="dim">'+Object.keys(POSTS).length+" 个文件, 使用 cat &lt;文件名&gt; 阅读</span>");
}
function cmdCat(arg){
  let name=null;
  if(/^\d+$/.test(arg)){const ks=Object.keys(POSTS);name=ks[+arg-1];}
  else{name=Object.keys(POSTS).find(f=>f===arg||f.startsWith(arg));}
  if(!name){print('<span class="err">cat: 找不到文件: '+esc(arg)+"</span>");return;}
  const p=POSTS[name];
  print('<div><div class="post-head">TITLE: '+esc(name)+
    "\nDATE : "+p.date+"    TAGS: "+p.tags+
    "\n"+"─".repeat(46)+"</div>"+
    '<div class="post-body">'+esc(p.body)+"</div></div>");
}
function cmdHelp(){
  const rows=[
    ["ls","列出全部文章"],
    ["cat &lt;n&gt;","阅读第 n 篇文章或指定文件"],
    ["about","关于博主"],
    ["theme [name]","切换配色 green / amber / ice"],
    ["whoami","你是谁"],
    ["date","当前时间"],
    ["echo ...","说句话"],
    ["history","命令历史"],
    ["clear","清屏"],
  ];
  let h='<table class="help">';
  rows.forEach(r=>{h+="<tr><td>"+r[0]+"</td><td>"+r[1]+"</td></tr>";});
  print(h+"</table>");
}
function exec(line){
  echo(line);
  const [cmd,...args]=line.split(/\s+/);const arg=args.join(" ");
  switch((cmd||"").toLowerCase()){
    case"":break;
    case"help":case"？":case"？":cmdHelp();break;
    case"ls":case"dir":cmdLs();break;
    case"cat":case"open":case"read":
      if(!arg){print('<span class="err">用法: cat &lt;编号或文件名&gt;</span>');}
      else cmdCat(arg);break;
    case"about":
      print(
'<span class="accent">@about_me</span>\n'+
"一个喜欢像素画和终端的开发者。\n"+
"信条: 用最少的字节, 表达最多的意思。\n\n"+
'<span class="dim">contact → mail: guest@pixel.dev  / github: @guest</span>');break;
    case"whoami":
      print("guest\n<span class=\"dim\">权限: 游客 (但好奇心不受限)</span>");break;
    case"date":
      print(new Date().toString());break;
    case"echo":raw(arg);break;
    case"history":
      hist.forEach((h,i)=>print(String(i+1).padStart(4)+"  "+esc(h)));break;
    case"theme":{
      const t=(arg||"").toLowerCase();
      const map={green:"green",amber:"amber",ice:"ice"};
      if(map[t]){document.body.dataset.theme=t;
        print("主题已切换 → <span class=\"accent\">"+t+"</span>");}
      else if(!t){print("当前主题: "+document.body.dataset.theme+
        "\n可选: green / amber / ice");}
      else print('<span class="err">未知主题: '+esc(arg)+" (可选 green/amber/ice)</span>");
      break;}
    case"clear":case"cls":out.innerHTML="";break;
    case"sudo":
      print('<span class="err">guest 不在 sudoers 文件中。此事件将被报告。(并不会)</span>');break;
    case"exit":case"quit":
      print('<span class="dim">没有真正的出口... 这只是网页 :) 试试 clear</span>');break;
    default:{
      const cands=Object.keys({help:1,ls:1,cat:1,about:1,theme:1}).filter(k=>k.startsWith(cmd[0]));
      print('<span class="err">未知命令: '+esc(cmd)+"</span>"+(cands.length?
        '<span class="dim">  你是想输入 "'+cands[0]+'" 吗?</span>':""));
    }
  }
  scrollEnd();
}
out.addEventListener("click",e=>{
  const f=e.target.closest(".file");
  if(f&&!busy){
    input.value=f.dataset.cmd;
    exec(f.dataset.cmd);
    input.value="";renderInput();
    focusInput();
  }
});
boot();
</script>
</body>
</html>
